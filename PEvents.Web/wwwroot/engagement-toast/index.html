<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engagement Toast Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Sacramento&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-image">
                <a href="https://maps.app.goo.gl/QqnpwaMKkHF4yWweA" target="_blank" class="location-link" title="Open Location">
                    <img src="assets/location.svg" alt="Location" class="location-icon">
                    <span>six seven terrasse</span>
                </a>
            </div>
            <button class="rsvp-button" id="openRsvp">RSVP now</button>
        </div>
    </div>

    <!-- RSVP Modal -->
    <div id="rsvpModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 class="cursive">RSVP</h2>
            <p>Will you be joining us?</p>
            <form id="rsvpForm">
                <input type="text" placeholder="Your Name" required>
                <div class="radio-group">
                    <label><input type="radio" name="attending" value="yes" checked> Happily Accept</label>
                    <label><input type="radio" name="attending" value="no"> Regretfully Decline</label>
                </div>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        const modal = document.getElementById("rsvpModal");
        const btn = document.getElementById("openRsvp");
        const span = document.getElementsByClassName("close")[0];

        btn.onclick = function() {
            modal.style.display = "block";
        }

        span.onclick = function() {
            modal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        document.getElementById("rsvpForm").onsubmit = function(e) {
            e.preventDefault();
            alert("Thank you for your response!");
            modal.style.display = "none";
        }
    </script>
</body>
</html>
