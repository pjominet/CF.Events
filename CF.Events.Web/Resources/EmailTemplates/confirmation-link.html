<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Confirm your email</title>
    <style type="text/css">
        /* Fonts alignment with webapp */
        body, table, td, p, a, span {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, .mail-body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            background-color: #e0e8e0;
        }

        .mail-wrapper {
            padding: 40px 0;
        }

        .mail-container {
            width: 600px;
            margin: 0 auto;
        }

        .mail-card {
            background-color: #dbe2f0;
            border: 1px solid #c0c8d0;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .mail-logo {
            color: #273427;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mail-title {
            margin: 0 0 20px;
            font-size: 24px;
            font-weight: bold;
            color: #273427;
            text-align: center;
        }

        .mail-text {
            font-size: 16px;
            line-height: 1.6;
            color: #2c3e50;
            margin: 16px 0;
            text-align: center;
        }

        .mail-button-container {
            margin: 30px 0;
            text-align: center;
        }

        .mail-button {
            background-color: #273427;
            border: 1px solid #273427;
            border-radius: 4px;
            color: #ffffff !important;
            display: inline-block;
            font-size: 16px;
            font-weight: 600;
            line-height: 44px;
            text-align: center;
            text-decoration: none;
            width: 220px;
            -webkit-text-size-adjust: none;
            mso-hide: all;
        }

        .mail-divider {
            border: 0;
            border-top: 1px solid #c0c8d0;
            margin: 20px 0;
        }

        @media screen and (max-width: 620px) {
            .mail-container {
                width: 90% !important;
            }
            .mail-card {
                padding: 20px !important;
            }
        }
    </style>
</head>
<body>
<table class="mail-body" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
        <td class="mail-wrapper" align="center">
            <table class="mail-container" cellspacing="0" cellpadding="0" border="0">
                <tr>
                    <td class="mail-logo">
                        {{ app_name }}
                    </td>
                </tr>
                <tr>
                    <td class="mail-card">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td>
                                    <h1 class="mail-title">
                                        <!--[if mso]><span style="font-family: sans-serif;"><![endif]-->
                                        Welcome, {{ user_name }}!
                                        <!--[if mso]></span><![endif]-->
                                    </h1>
                                    <p class="mail-text">
                                        <!--[if mso]><span style="font-family: sans-serif;"><![endif]-->
                                        Thank you for registering. Please confirm your email address by clicking the button below.
                                        <!--[if mso]></span><![endif]-->
                                    </p>
                                </td>
                            </tr>
                            <tr>
                                <td class="mail-button-container" align="center">
                                    <div>
                                        <!--[if mso]>
                                        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ confirm_url }}" style="height:44px;v-text-anchor:middle;width:220px;" arcsize="10%" stroke="f" fillcolor="#273427">
                                            <w:anchorlock/>
                                            <center style="color:#ffffff;font-family:sans-serif;font-size:16px;font-weight:bold;">
                                                Confirm Email
                                            </center>
                                        </v:roundrect>
                                        <![endif]-->
                                        <a href="{{ confirm_url }}" class="mail-button">
                                            Confirm Email
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <hr class="mail-divider" />
                                    <p class="mail-text" style="font-size: 12px; opacity: 0.8;">
                                        <!--[if mso]><span style="font-family: sans-serif;"><![endif]-->
                                        If you're having trouble with the button above, copy and paste the URL below into your web browser:
                                        <br/>
                                        {{ confirm_url }}
                                        <!--[if mso]></span><![endif]-->
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
