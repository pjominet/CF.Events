<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Save the Date {{ event_date }}</title>
    <style type="text/css">
        /* Fonts alignment with webapp */
        body, table, td, p, a, span {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .serif {
            font-family: "Georgia", serif !important;
        }

        .footnote {
            font-size: 12px !important;
            opacity: 0.8 !important;
        }

        body, .mail-body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            min-height: 100vh;
            background-color: #f9f9f9;
        }

        .mail-wrapper {
            background-color: #f9f9f9;
            padding: 40px 0;
            vertical-align: top;
        }

        .mail-container {
            width: 600px;
            margin: 0 auto;
        }

        .mail-card {
            background: #731616; /* Fallback */
            background: linear-gradient(155deg, #5a0819 0%, #731616 25%, #8c1c1c 50%, #731616 75%, #5a0819 100%);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .mail-card-inner {
            border: 3px solid #c5b358;
            border-radius: 4px;
            padding: 40px;
        }

        .mail-logo {
            color: #2e2e2e;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            padding-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .mail-title {
            margin: 0 0 20px;
            font-size: 28px;
            font-weight: bold;
            color: #f5f5f5;
        }

        .mail-text {
            font-style: italic;
            font-size: 18px;
            line-height: 1.6;
            color: #f5f5f5;
            margin: 16px 0;
        }

        .mail-button-container {
            margin: 20px 0;
        }

        .mail-button {
            background-color: #c5b358;
            border: 1px solid #c5b358;
            border-radius: 12px;
            color: #731616 !important;
            display: inline-block;
            font-size: 18px;
            font-weight: 600;
            line-height: 50px;
            text-align: center;
            text-decoration: none;
            width: 200px;
            -webkit-text-size-adjust: none;
            mso-hide: all;
        }

        @media screen and (max-width: 620px) {
            .mail-container {
                width: 100% !important;
            }
            .mail-wrapper {
                padding: 0 !important;
            }
            .mail-card {
                border-radius: 0 !important;
                padding: 4px !important;
            }
            .mail-card-inner {
                border-radius: 0 !important;
                padding: 30px 15px !important;
            }
        }
    </style>
</head>
<body>
<table class="mail-body" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
        <td class="mail-wrapper" align="center">
            <table class="mail-container" cellspacing="0" cellpadding="0" border="0">
                <tr>
                    <td class="mail-logo">
                        {{ app_name }}
                    </td>
                </tr>
                <tr>
                    <td class="mail-card">
                        <table width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td class="mail-card-inner">
                                    <table width="100%" cellspacing="0" cellpadding="0" border="0">
                                        <tr>
                                            <td>
                                                <h1 class="mail-title">
                                                    <!--[if mso]><span style="font-family: sans-serif;"><![endif]-->
                                                    Hi {{ user_name }}!
                                                    <!--[if mso]></span><![endif]-->
                                                </h1>
                                                <p class="mail-text serif">
                                                    <!--[if mso]><span style="font-family: serif;"><![endif]-->
                                                    {{ sender_sig }} would like you to save a special date.
                                                    <!--[if mso]></span><![endif]-->
                                                </p>
                                                <p class="mail-text serif">
                                                    <!--[if mso]><span style="font-family: serif;"><![endif]-->
                                                    Click below to see what's happening on {{ event_date }}.
                                                    <!--[if mso]></span><![endif]-->
                                                </p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td align="center">
                                                <div class="mail-button-container">
                                                    <!--[if mso]>
                                                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ invite_url }}" style="height:50px;v-text-anchor:middle;width:200px;" arcsize="8%" stroke="f" fillcolor="#c5b358">
                                                        <w:anchorlock/>
                                                        <center style="color:#5a0819;font-family:sans-serif;font-size:16px;font-weight:bold;">
                                                            Have a look
                                                        </center>
                                                    </v:roundrect>
                                                    <![endif]-->
                                                    <a href="{{ invite_url }}" class="mail-button">
                                                        Have a look
                                                    </a>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <p class="mail-text footnote">
                                                    <!--[if mso]><span style="font-family: sans-serif;"><![endif]-->
                                                    If you're having trouble with the button above, copy and paste the URL below into your web browser:
                                                    <br/>
                                                    <a href="{{ invite_url }}" style="color: #c5b358;">{{ invite_url }}</a>
                                                    <!--[if mso]></span><![endif]-->
                                                </p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
