<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Engagement Toast Invitation</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Sacramento&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
<div class="card-container">
    <div class="card">
        <div class="card-image">
            <a class="location-link" href="https://maps.app.goo.gl/QqnpwaMKkHF4yWweA" target="_blank" title="Open Location">
                <img alt="Location" class="location-icon" src="assets/location.svg">
                <span>six seven terrasse</span>
            </a>
        </div>
        <a class="rsvp-button" href="rsvp.html" id="openRsvp">RSVP now</a>
    </div>
</div>

<script>
    // Simple fingerprinting check to redirect recurring users
    function getFingerprint() {
        return localStorage.getItem("rsvp_fingerprint");
    }

    async function checkAndRedirect() {
        const fingerprint = getFingerprint();
        if (!fingerprint) return;

        const apiBaseUrl = window.location.protocol === "https:" ? "https://localhost:7041" : "http://localhost:5041";

        try {
            const response = await fetch(`${apiBaseUrl}/api/events/engagement/rsvp/check/${fingerprint}`);
            if (response.ok) {
                // Recurring user detected, redirect to RSVP page
                window.location.href = "rsvp.html";
            }
        } catch (error) {
            console.error("Status check failed:", error);
        }
    }

    // Run check on load
    checkAndRedirect();
</script>
</body>
</html>
