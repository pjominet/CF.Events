<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>RSVP List - Engagement Toast</title>
    <link href="style.css" rel="stylesheet">
</head>
<body class="admin-page">
<div class="admin-container">
    <h1>RSVP Responses</h1>
    <div class="rsvp-table-container" id="rsvpList" style="display: none;">
        <div class="admin-controls">
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Attendance:</span>
                    <span class="stat-value" id="totalAttendance">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Dinner Guests:</span>
                    <span class="stat-value" id="totalDinner">0</span>
                </div>
            </div>
            <button class="refresh-btn" id="refreshBtn">Refresh List</button>
        </div>
        <p id="loadingMessage">Loading responses...</p>
        <table class="rsvp-table" id="rsvpTable" style="display: none;">
            <thead>
            <tr>
                <th>Name</th>
                <th>Attending</th>
                <th>+1</th>
                <th>Dinner</th>
                <th>Comments</th>
                <th>Date</th>
            </tr>
            </thead>
            <tbody id="rsvpTableBody">
            <!-- Rows will be injected here -->
            </tbody>
        </table>
        <p id="noRsvpsMessage" style="display: none;">No RSVPs received yet.</p>
    </div>
    <div class="login-container" id="setupSection" style="display: none;">
        <h2>Initial Admin Setup</h2>
        <p>Please set a password for the admin account.</p>
        <form id="setupForm">
            <input id="setupPassword" placeholder="Set Password" required type="password">
            <input id="confirmPassword" placeholder="Confirm Password" required type="password">
            <button type="submit">Set Password</button>
        </form>
        <p class="error" id="setupError" style="display: none;"></p>
    </div>
    <div class="login-container" id="loginSection" style="display: none;">
        <h2>Login</h2>
        <form id="loginForm">
            <input id="password" placeholder="Enter Password" required type="password">
            <button type="submit">Login</button>
        </form>
        <p class="error" id="loginError" style="display: none;">Incorrect password.</p>
    </div>
</div>

<script>
    const setupForm = document.getElementById('setupForm');
    const setupSection = document.getElementById('setupSection');
    const loginForm = document.getElementById('loginForm');
    const loginSection = document.getElementById('loginSection');
    const rsvpList = document.getElementById('rsvpList');
    const loginError = document.getElementById('loginError');
    const setupError = document.getElementById('setupError');
    const apiBaseUrl = window.location.protocol === "https:" ? "https://localhost:7041" : "http://localhost:5041";
    let refreshTimer = null;

    async function checkSetup() {
        try {
            const response = await fetch(`${apiBaseUrl}/api/events/engagement/setup-status`);
            const data = await response.json();
            if (data.needsSetup) {
                setupSection.style.display = 'block';
                loginSection.style.display = 'none';
            } else {
                setupSection.style.display = 'none';
                if (!sessionStorage.getItem('adminToken')) {
                    loginSection.style.display = 'block';
                }
            }
        } catch (error) {
            console.error('Error checking setup status:', error);
        }
    }

    setupForm.onsubmit = async function (e) {
        e.preventDefault();
        const password = document.getElementById('setupPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
            setupError.textContent = 'Passwords do not match.';
            setupError.style.display = 'block';
            return;
        }

        try {
            const response = await fetch(`${apiBaseUrl}/api/events/engagement/setup?password=${encodeURIComponent(password)}`, {
                method: 'POST'
            });

            if (response.ok) {
                alert('Admin setup successful! Please login.');
                setupSection.style.display = 'none';
                loginSection.style.display = 'block';
            } else {
                const msg = await response.text();
                setupError.textContent = msg || 'Setup failed.';
                setupError.style.display = 'block';
            }
        } catch (error) {
            console.error('Setup error:', error);
            setupError.textContent = 'Could not connect to server.';
            setupError.style.display = 'block';
        }
    };

    function parseJwt(token) {
        try {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            return null;
        }
    }

    function scheduleRefresh(token) {
        if (refreshTimer) clearTimeout(refreshTimer);

        const payload = parseJwt(token);
        if (!payload || !payload.exp) return;

        const expiryTime = payload.exp * 1000;
        const currentTime = Date.now();
        const timeUntilExpiry = expiryTime - currentTime;

        // Auto-logout if already expired
        if (timeUntilExpiry <= 0) {
            logout();
            return;
        }

        // Refresh 2 minutes before expiry, or halfway if it expires in less than 4 minutes
        const refreshIn = Math.max(0, timeUntilExpiry - (2 * 60 * 1000));
        const safeRefreshIn = refreshIn > 0 ? refreshIn : timeUntilExpiry / 2;

        refreshTimer = setTimeout(async () => {
            await refreshToken();
        }, safeRefreshIn);
    }

    async function refreshToken() {
        const token = sessionStorage.getItem('adminToken');
        if (!token) return;

        try {
            const response = await fetch(`${apiBaseUrl}/api/events/engagement/refresh`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const data = await response.json();
                sessionStorage.setItem('adminToken', data.token);
                scheduleRefresh(data.token);
                console.log('Token refreshed successfully');
            } else {
                logout();
            }
        } catch (error) {
            console.error('Refresh error:', error);
            // If we can't refresh but token is still valid, we'll try again later or it will expire
        }
    }

    function logout() {
        if (refreshTimer) clearTimeout(refreshTimer);
        sessionStorage.removeItem('adminToken');
        loginSection.style.display = 'block';
        rsvpList.style.display = 'none';
        loginError.textContent = 'Session expired. Please login again.';
        loginError.style.display = 'block';
    }

    loginForm.onsubmit = async function (e) {
        e.preventDefault();
        const password = document.getElementById('password').value;

        try {
            const response = await fetch(`${apiBaseUrl}/api/events/engagement/login?password=${encodeURIComponent(password)}`, {
                method: 'POST'
            });

            if (response.ok) {
                const data = await response.json();
                sessionStorage.setItem('adminToken', data.token);
                scheduleRefresh(data.token);
                showAdminContent();
            } else {
                loginError.style.display = 'block';
            }
        } catch (error) {
            console.error('Login error:', error);
            loginError.textContent = 'Could not connect to server.';
            loginError.style.display = 'block';
        }
    };

    async function showAdminContent() {
        loginSection.style.display = 'none';
        rsvpList.style.display = 'block';
        await fetchRsvps();
    }

    document.getElementById('refreshBtn').onclick = fetchRsvps;

    async function fetchRsvps() {
        const rsvpListContainer = document.getElementById('rsvpList');
        const tableBody = document.getElementById('rsvpTableBody');
        const table = document.getElementById('rsvpTable');
        const loadingMessage = document.getElementById('loadingMessage');
        const noRsvpsMessage = document.getElementById('noRsvpsMessage');
        const token = sessionStorage.getItem('adminToken');

        if (!token) {
            loginSection.style.display = 'block';
            rsvpList.style.display = 'none';
            return;
        }

        try {
            const response = await fetch(`${apiBaseUrl}/api/events/engagement/rsvp`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 401) {
                logout();
                return;
            }

            if (!response.ok) throw new Error('Failed to fetch RSVPs');

            const rsvps = await response.json();
            loadingMessage.style.display = 'none';

            if (rsvps.length === 0) {
                table.style.display = 'none';
                noRsvpsMessage.style.display = 'block';
                return;
            }

            noRsvpsMessage.style.display = 'none';
            table.style.display = 'table';
            tableBody.innerHTML = '';

            let totalAttending = 0;
            let totalDinner = 0;

            rsvps.forEach(rsvp => {
                if (rsvp.attending) {
                    totalAttending += 1; // The person themselves
                    if (rsvp.bringsPlusOne) {
                        totalAttending += 1; // Their +1
                    }
                    if (rsvp.joinForDinner) {
                        totalDinner += 1; // Only the person? Or +1 too? Usually RSVP form means guest group.
                        // User asked: "add a global counter for total attendance and one for people who also come for dinner."
                        // and "add a checkbox in case of accept asking if the attendee brings a +1, count those too in the counter"
                        // If they come for dinner, usually +1 also comes. I will assume dinner count is for people.
                        if (rsvp.bringsPlusOne) {
                            totalDinner += 1;
                        }
                    }
                }

                const date = new Date(rsvp.submittedAt).toLocaleDateString();
                const row = document.createElement('tr');
                row.innerHTML = `
                        <td>${rsvp.name}</td>
                        <td>${rsvp.attending ? '✅ Yes' : '❌ No'}</td>
                        <td>${rsvp.attending && rsvp.bringsPlusOne ? '👥 +1' : '-'}</td>
                        <td>${rsvp.attending && rsvp.joinForDinner ? '🍴 Yes' : '-'}</td>
                        <td class="comment-cell">${rsvp.comments || ''}</td>
                        <td>${date}</td>
                    `;
                tableBody.appendChild(row);
            });

            document.getElementById('totalAttendance').textContent = totalAttending;
            document.getElementById('totalDinner').textContent = totalDinner;

        } catch (error) {
            console.error('Error:', error);
            loadingMessage.style.display = 'none';
            rsvpListContainer.innerHTML = '<p class="error">Error loading RSVPs. Please ensure the API is running.</p>';
        }
    }

    if (sessionStorage.getItem('adminToken')) {
        (async () => {
            const token = sessionStorage.getItem('adminToken');
            scheduleRefresh(token);
            await showAdminContent();
        })();
    } else {
        checkSetup();
    }
</script>
</body>
</html>
