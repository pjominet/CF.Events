services:
  cf-events-api:
    build:
      context: .
      dockerfile: CF.Events.API/Dockerfile
    container_name: cf-events-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=OyINhOESzMsC6hWcSU1F1L453mOi88Gs
      - Jwt__Issuer=CF.Events.API
      - Jwt__Audience=CF.Events.Web
    volumes:
      - ./data:/app/data
    ports:
      - 5041:8081
    restart: always

  cf-events-web:
    build:
      context: .
      dockerfile: CF.Events.Web/Dockerfile
    container_name: cf-events-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - EventsApi__BaseUrl=http://cf-events-api:8081
    ports:
      - 5019:8082
    depends_on:
      - cf-events-api
    restart: always
