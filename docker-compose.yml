services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: events-web-db
        mem_limit: 4g
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=${SQL_PASSWORD}
            - MSSQL_PID=Express
        ports:
            - "3341:1433"
        volumes:
            - /volume2/docker/configs/cf.events/data:/var/opt/mssql:rw
        networks:
            - events-net
        healthcheck:
            test: [ "CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_PASSWORD}", "-Q", "SELECT 1" ]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 15s

    cf-events-web:
        image: ghcr.io/pjominet/cf.events-web:latest
        container_name: events-web
        mem_limit: 1g
        environment:
            - ASPNETCORE_ENVIRONMENT=Production
            - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=cfevents;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;Encrypt=False;
            - AppSettings__Mailjet__ApiKey=${MAILJET_API_KEY}
            - AppSettings__Mailjet__ApiSecret=${MAILJET_API_SECRET}
        volumes:
            - /volume2/docker/configs/cf.events/keys:/app/keys:rw
            - /volume2/docker/configs/cf.events/logs:/app/logs:rw
        ports:
            - 5019:8082
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - proxy-net
            - events-net
        restart: unless-stopped

networks:
    events-net:
        external: true
    proxy-net:
        external: true
